<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORCA — Ocean Reasoning &amp; Collaborative Agents</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#050b14; --deep:#081420; --panel:rgba(10,22,35,.82); --panel-2:rgba(14,29,46,.9);
  --line:rgba(94,178,196,.16); --line-2:rgba(94,178,196,.32);
  --ink:#e8f4f8; --ink-dim:#8da9b8; --ink-faint:#5b7686;
  --teal:#4fd1c5; --cyan:#38bdf8; --amber:#fbbf24; --rose:#fb7185; --violet:#a78bfa; --lime:#a3e635;
  --favourable:#34d399; --marginal:#fbbf24; --unfavourable:#fb923c; --unsafe:#f43f5e; --unknown:#64748b;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--abyss);color:var(--ink);
  font:14px/1.55 Inter,system-ui,-apple-system,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
#map{position:fixed;inset:0}
/* the particle canvas must float over the map, not sit in document flow */
#wind{position:fixed;inset:0;pointer-events:none;z-index:5}
/* caustic shimmer over the sea — pure atmosphere, no data meaning */
#caustics{position:fixed;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:screen;
  background:
    radial-gradient(60% 40% at 20% 30%,#5eead4 0,transparent 60%),
    radial-gradient(50% 50% at 75% 65%,#38bdf8 0,transparent 60%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1.05)}to{transform:translate3d(3%,2%,0) scale(1.15)}}
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 45%,rgba(2,6,12,.75) 100%)}

/* ---------- chrome ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:40;display:flex;align-items:center;
  gap:16px;padding:0 18px;background:linear-gradient(180deg,rgba(5,11,20,.94),rgba(5,11,20,.55) 70%,transparent);
  backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:700;letter-spacing:.02em}
.brand b{font-size:17px;background:linear-gradient(92deg,var(--teal),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.16em}
.topbar .spacer{flex:1}
.health{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-dim);
  font-family:var(--mono);cursor:pointer;padding:5px 10px;border:1px solid var(--line);border-radius:999px}
.health:hover{border-color:var(--line-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--favourable);
  box-shadow:0 0 0 3px rgba(52,211,153,.14)}
.dot.warn{background:var(--amber);box-shadow:0 0 0 3px rgba(251,191,36,.14)}

/* ---------- panels ---------- */
.panel{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.045)}
#left{top:64px;left:16px;width:410px;bottom:16px;display:flex;flex-direction:column;overflow:hidden}
#right{top:64px;right:16px;width:370px;bottom:16px;display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 24px));transition:transform .45s cubic-bezier(.16,1,.3,1)}
#right.open{transform:none}
.phead{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;flex:0 0 auto}
.phead .x{margin-left:auto;cursor:pointer;color:var(--ink-faint);font-size:15px;line-height:1}
.phead .x:hover{color:var(--ink)}
.pbody{flex:1;overflow-y:auto;padding:14px 15px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.pbody::-webkit-scrollbar{width:7px}
.pbody::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}

/* ---------- ask ---------- */
.ask{padding:13px 14px;border-top:1px solid var(--line);flex:0 0 auto;background:rgba(6,15,25,.6)}
.askrow{display:flex;gap:8px;align-items:flex-end}
textarea#q{flex:1;resize:none;height:44px;max-height:120px;background:rgba(4,12,20,.85);
  border:1px solid var(--line-2);border-radius:10px;color:var(--ink);padding:11px 13px;
  font:14px/1.4 Inter,sans-serif;outline:none;transition:border-color .2s}
textarea#q:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(79,209,197,.1)}
button.go{width:44px;height:44px;border-radius:10px;border:none;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(140deg,var(--teal),var(--cyan));color:#04121a;font-size:17px;font-weight:700;
  transition:transform .15s,filter .15s}
button.go:hover{transform:translateY(-1px);filter:brightness(1.08)}
button.go:disabled{opacity:.4;cursor:default;transform:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;max-height:74px;overflow:hidden}
.chip{font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--ink-dim);cursor:pointer;transition:.18s;white-space:nowrap}
.chip:hover{border-color:var(--teal);color:var(--teal);background:rgba(79,209,197,.07)}

/* ---------- trace ---------- */
.trace{display:flex;flex-direction:column;gap:3px}
.tnode{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;
  border:1px solid transparent;font-size:12.5px;opacity:0;transform:translateY(6px);
  animation:pop .34s cubic-bezier(.16,1,.3,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.tnode.live{border-color:rgba(79,209,197,.35);background:rgba(79,209,197,.07)}
.tdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--teal);position:relative}
.tdot.err{background:var(--unsafe)}
.tdot.warn{background:var(--amber)}
.tdot::after{content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1px solid currentColor;opacity:0;animation:ping 1.1s ease-out}
.tnode.live .tdot::after{opacity:.6}
@keyframes ping{from{transform:scale(.6);opacity:.8}to{transform:scale(2.1);opacity:0}}
.tname{font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.tmeta{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.tsum{font-size:11px;color:var(--ink-dim);padding:0 9px 7px 30px;margin-top:-3px;line-height:1.45}
.rail{width:1px;background:linear-gradient(var(--line-2),transparent);margin-left:13px;height:9px}

/* ---------- verdicts ---------- */
.verdicts{display:flex;flex-direction:column;gap:11px}
.vcard{border:1px solid var(--line);border-radius:12px;padding:12px 13px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.028),transparent)}
.vcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.vtop{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.vdom{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.vverdict{margin-left:auto;font-weight:700;font-size:13px;color:var(--c);letter-spacing:.01em}
.vconf{font-size:10px;font-family:var(--mono);color:var(--ink-faint);
  border:1px solid var(--line);padding:2px 6px;border-radius:5px}
/* threshold band gauge */
.gauge{margin:9px 0 4px}
.grow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.glabel{font-size:11.5px;color:var(--ink-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gval{font-family:var(--mono);font-size:11.5px;color:var(--ink);flex:0 0 auto}
.gbar{height:6px;border-radius:3px;position:relative;overflow:hidden;display:flex;background:rgba(255,255,255,.05)}
.gseg{height:100%}
.gpin{position:absolute;top:-3px;width:2px;height:12px;background:#fff;border-radius:1px;
  box-shadow:0 0 7px rgba(255,255,255,.85);transition:left .7s cubic-bezier(.16,1,.3,1)}
.limiting{color:var(--amber)}
.gaps{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);
  font-size:11px;color:var(--ink-faint);line-height:1.5}
.gaps b{color:var(--ink-dim);font-weight:600}
.rationale{margin-top:9px;font-size:11.5px;color:var(--ink-dim);line-height:1.55}

/* ---------- misc ---------- */
.headline{font-size:15.5px;line-height:1.5;font-weight:600;margin-bottom:4px}
.sub{font-size:11.5px;color:var(--ink-faint);font-family:var(--mono);margin-bottom:14px}
.alert{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:9px;margin-bottom:7px;
  border:1px solid rgba(251,191,36,.28);background:rgba(251,191,36,.07);font-size:12px}
.alert.warning{border-color:rgba(244,63,94,.32);background:rgba(244,63,94,.08)}
.alert i{font-style:normal;font-size:13px}
.ev{border-left:2px solid var(--line-2);padding:6px 0 6px 11px;margin-bottom:8px;font-size:12px}
.ev .p{font-family:var(--mono);font-size:10px;color:var(--ink-faint);cursor:pointer}
.ev .p:hover{color:var(--teal)}
.empty{color:var(--ink-faint);font-size:12px;padding:16px 0;text-align:center}
/* ORCA asking a question, rather than answering one */
.clarify{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;
  border:1px solid rgba(79,209,197,.3);background:rgba(79,209,197,.06);
  animation:pop .34s cubic-bezier(.16,1,.3,1) both}
.qmark{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--teal),var(--cyan));color:#04121a;
  font-weight:700;font-size:15px}
.sec{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:600;margin:16px 0 9px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}
.disclaimer{margin-top:14px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.022);font-size:11px;color:var(--ink-faint);line-height:1.5}

/* ---------- layer switch ---------- */
.layers{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:35;display:flex;gap:5px;
  padding:5px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);
  backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.lbtn{padding:7px 13px;border-radius:8px;border:none;background:transparent;color:var(--ink-dim);
  font:500 12px Inter,sans-serif;cursor:pointer;transition:.18s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.lbtn:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.lbtn.on{background:linear-gradient(140deg,rgba(79,209,197,.2),rgba(56,189,248,.14));
  color:var(--teal);box-shadow:inset 0 0 0 1px rgba(79,209,197,.3)}
.lbtn .ld{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.lbtn.loading .ld{animation:blink .7s infinite}
@keyframes blink{50%{opacity:.1}}

/* ---------- legend ---------- */
.legend{position:fixed;right:16px;bottom:18px;z-index:34;padding:11px 13px;border-radius:11px;
  background:var(--panel-2);border:1px solid var(--line);backdrop-filter:blur(14px);
  font-size:11px;color:var(--ink-dim);min-width:172px;display:none}
.legend.show{display:block}
.legend h4{margin:0 0 8px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.ramp{height:9px;border-radius:5px;margin-bottom:5px}
.rlab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.cov{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:10.5px;line-height:1.45}

.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line-2);
  border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.maplibregl-ctrl-attrib{background:rgba(5,11,20,.7)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--ink-faint)!important}
@media (max-width:1320px){#left{width:360px}#right{width:330px}}
/* Below this the two side panels would overlap and the trace would cover the
   answer. Dock the trace to the bottom instead of the right. */
/* Below this the panels would overlap. Stack them: layers under the topbar,
   the conversation next, and the trace as a bottom sheet. */
@media (max-width:1120px){
  .layers{top:58px;bottom:auto;left:12px;right:12px;transform:none;
    max-width:none;overflow-x:auto;justify-content:flex-start;
    -webkit-overflow-scrolling:touch}
  .layers::-webkit-scrollbar{display:none}
  #left{top:106px;left:12px;right:12px;width:auto;bottom:auto;max-height:calc(100vh - 122px)}
  #right{top:auto;left:12px;right:12px;width:auto;bottom:12px;max-height:44vh;
    transform:translateY(calc(100% + 24px))}
  #right.open{transform:none}
  #right.open ~ #left{max-height:calc(56vh - 118px)}
  .legend{display:none!important}
}
@media (max-width:640px){
  .brand span{display:none}
  #left{max-height:52vh}
  .lbtn{padding:6px 9px;font-size:11px}
}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="wind"></canvas>
<div id="caustics"></div>
<div id="vignette"></div>

<div class="topbar">
  <div class="brand"><b>ORCA</b><span>Ocean Reasoning &amp; Collaborative Agents</span></div>
  <div class="spacer"></div>
  <div class="health" id="health" title="Live source health"><span class="dot"></span><span id="healthTxt">…</span></div>
</div>

<section class="panel" id="left">
  <div class="phead"><span>Conversation</span><span id="langBadge" class="vconf" style="margin-left:auto"></span></div>
  <div class="pbody" id="out">
    <div class="empty">
      Ask about safety, fishing conditions, maritime boundaries or a route.<br><br>
      Answers are evidence-bound and every number traces to a source.
    </div>
  </div>
  <div class="ask">
    <div class="chips" id="chips"></div>
    <div class="askrow">
      <textarea id="q" placeholder="Is it good for fishing near Kochi tomorrow morning?" rows="1"></textarea>
      <button class="go" id="go" title="Ask">→</button>
    </div>
  </div>
</section>

<aside class="panel" id="right">
  <div class="phead"><span id="rTitle">Agent trace</span><span class="x" id="rClose">✕</span></div>
  <div class="pbody" id="rBody"></div>
</aside>

<div class="layers" id="layers"></div>
<div class="legend" id="legend"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/ui/wind.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
